name: LUMA outage check

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luma-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LUMA outage data
        run: python3 scripts/luma_check.py
      - name: Save to repo
        run: |
          git config user.name "oeste-luma-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luma.json
          git diff --cached --quiet && exit 0
          git commit -m "LUMA check $(TZ=America/Puerto_Rico date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
